apiVersion: apps/v1
kind: Deployment
metadata:
  name: products-service
  namespace: ecommerce
  labels:
    app: products-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: products-service
  template:
    metadata:
      labels:
        app: products-service
    spec:
      containers:
        - name: products-service
          image: hgyang25/products-service:latest
          ports:
            - containerPort: 3003
          envFrom:
            - configMapRef:
                name: ecommerce-config
            - secretRef:
                name: ecommerce-secrets
          env:
            - name: OTEL_TRACES_EXPORTER
              value: "otlp"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://10.0.30.65:30417"
            - name: OTEL_METRICS_EXPORTER
              value: "none"
            - name: OTEL_LOGS_EXPORTER
              value: "none"
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
                value: "grpc"
              - name: OTEL_SERVICE_NAME
                value: "products-service"
              - name: SERVICE_NAME
              value: "products-service"
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
                            memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: products-service
  namespace: ecommerce
spec:
  selector:
    app: products-service
  ports:
    - port: 3003
      targetPort: 3003
  type: ClusterIP





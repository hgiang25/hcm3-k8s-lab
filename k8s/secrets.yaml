# IMPORTANT: In production, use `kubectl create secret` or a secrets manager
# instead of committing this file. This file is a TEMPLATE only.
#
# To create secrets from CLI:
#   kubectl create secret generic ecommerce-secrets \
#     --namespace=ecommerce \
#     --from-literal=DATABASE_URL='mongodb://user:pass@host:27017/dbFashion' \
#     --from-literal=JWT_SECRET='your-super-secret-jwt-key' \
#     --from-literal=OPEN_AI_API_KEY='sk-...' \
#     --from-literal=HUGGING_FACE_API_KEY='hf_...'

apiVersion: v1
kind: Secret
metadata:
  name: ecommerce-secrets
  namespace: ecommerce
type: Opaque
stringData:
  # Postgres URI (Internal K8s Service)
  DATABASE_URL: 'postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres-server:5432/dbFashion?schema=public'

  # Redis (CMC Cloud Managed Redis via internal Service redis-db-ao)
  REDIS_CONNECTION_URI: 'redis://default:${REDIS_PASSWORD}@redis-db-ao:6379'

  # JWT Secret
  JWT_SECRET: 'change-me-to-a-strong-secret'

  # Optional: AI API Keys
  OPEN_AI_API_KEY: ''
  HUGGING_FACE_API_KEY: ''

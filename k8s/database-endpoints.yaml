---
# --- REDIS ---
apiVersion: v1
kind: Service
metadata:
  name: redis-db-ao
  namespace: ecommerce
spec:
  ports:
    - port: 6379
---
apiVersion: v1
kind: Endpoints
metadata:
  name: redis-db-ao
  namespace: ecommerce
subsets:
  - addresses:
      - ip: ${REDIS_IP}
    ports:
      - port: 6379

# --- MONGODB ---
---
apiVersion: v1
kind: Service
metadata:
  name: mongo-db-ao
  namespace: ecommerce
spec:
  ports:
    - port: 27017
---
apiVersion: v1
kind: Endpoints
metadata:
  name: mongo-db-ao
  namespace: ecommerce
subsets:
  - addresses:
      - ip: ${MONGO_IP}
    ports:
      - port: 27017

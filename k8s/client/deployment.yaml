apiVersion: apps/v1
kind: Deployment
metadata:
  name: client
  namespace: ecommerce
  labels:
    app: client
spec:
  replicas: 2
  selector:
    matchLabels:
      app: client
  template:
    metadata:
      labels:
        app: client
    spec:
      containers:
        - name: client
          image: ${CONTAINER_REGISTRY}/client:latest
          ports:
            - containerPort: 4200
          envFrom:
            - configMapRef:
                name: ecommerce-config
            - secretRef:
                name: ecommerce-secrets
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /
              port: 4200
            initialDelaySeconds: 15
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 4200
            initialDelaySeconds: 20
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: client
  namespace: ecommerce
spec:
  selector:
    app: client
  ports:
    - port: 4200
      targetPort: 4200
  type: ClusterIP

apiVersion: apps/v1
kind: Deployment
metadata:
  name: cdn
  namespace: ecommerce
  labels:
    app: cdn
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cdn
  template:
    metadata:
      labels:
        app: cdn
    spec:
      containers:
        - name: cdn
          image: ${CONTAINER_REGISTRY}/cdn:latest
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: cdn
  namespace: ecommerce
spec:
  selector:
    app: cdn
  ports:
    - port: 8080
      targetPort: 80
  type: ClusterIP

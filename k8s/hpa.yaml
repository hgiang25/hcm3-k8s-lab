# ============================================================
# HPA: Tự động mở rộng Pod khi CPU vượt ngưỡng 70%
# ============================================================

# 1. HPA cho API Gateway (cổng vào chịu tải nặng nhất)
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api-gateway-hpa
  namespace: ecommerce
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: api-gateway
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70

---

name: Database Backup

on:
  workflow_dispatch: # Manual trigger
  schedule:
    - cron: '0 19 * * 6' # Saturday 19:00 UTC = Sunday 02:00 UTC+7 (Vietnam)

env:
  BACKUP_RETENTION_DAYS: 30

jobs:
  backup-postgresql:
    name: Backup PostgreSQL
    runs-on: self-hosted

    steps:
      - name: Install PostgreSQL client
        run: |
          if ! command -v pg_dump >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y postgresql-client
          fi

      - name: Create backup directory
        run: mkdir -p backups

      - name: Dump PostgreSQL database
        env:
          PGPASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        run: |
          echo "Starting PostgreSQL backup..."

          pg_dump \
            --host="${{ secrets.POSTGRES_IP }}" \
            --port=5432 \
            --username="${{ secrets.POSTGRES_USER }}" \
            --dbname=dbFashion \
            --format=custom \
            --compress=9 \
            --file=backups/postgresql.dump

          echo "PostgreSQL backup completed."

      - name: Show backup size
        run: ls -lh backups/

      - name: Configure CMC S3 Credentials
        run: |
          echo "AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}" >> "$GITHUB_ENV"
          echo "AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}" >> "$GITHUB_ENV"
          echo "AWS_DEFAULT_REGION=ap-southeast-1" >> "$GITHUB_ENV"

      - name: Upload backup to S3
        run: |
          TIMESTAMP=$(date +"%Y-%m-%d_%H-%M-%S")

          aws s3 cp \
            backups/postgresql.dump \
            s3://${{ secrets.S3_BACKUP_BUCKET }}/postgresql/${TIMESTAMP}/postgresql.dump \
            --endpoint-url=${{ secrets.S3_ENDPOINT }}

          echo "PostgreSQL backup uploaded to S3."

      - name: Cleanup old backups (older than ${{ env.BACKUP_RETENTION_DAYS }} days)
        run: |
          CUTOFF_DATE=$(date -d "-${{ env.BACKUP_RETENTION_DAYS }} days" +"%Y-%m-%d")

          aws s3 ls s3://${{ secrets.S3_BACKUP_BUCKET }}/postgresql/ --endpoint-url=${{ secrets.S3_ENDPOINT }} | while read -r line; do
            FOLDER_DATE=$(echo "$line" | awk '{print $2}' | cut -d'/' -f1 | cut -d'_' -f1)
            if [[ "$FOLDER_DATE" < "$CUTOFF_DATE" ]]; then
              FOLDER_NAME=$(echo "$line" | awk '{print $2}')
              echo "Deleting old backup: $FOLDER_NAME"
              aws s3 rm "s3://${{ secrets.S3_BACKUP_BUCKET }}/postgresql/${FOLDER_NAME}" --recursive --endpoint-url=${{ secrets.S3_ENDPOINT }}
            fi
          done

      - name: Upload backup as GitHub Artifact (fallback)
        uses: actions/upload-artifact@v4
        with:
          name: postgresql-backup-${{ github.run_number }}
          path: backups/postgresql.dump
          retention-days: 7

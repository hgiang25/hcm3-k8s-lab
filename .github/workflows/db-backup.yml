name: Database Backup

on:
  workflow_dispatch: # Manual trigger
  schedule:
    - cron: '0 19 * * *' # 19:00 UTC = 02:00 UTC+7 (Vietnam)

env:
  BACKUP_RETENTION_DAYS: 30

jobs:
  backup-mongodb:
    name: Backup MongoDB
    runs-on: ubuntu-latest

    steps:
      - name: Install MongoDB tools
        run: |
          wget -qO- https://www.mongodb.org/static/pgp/server-7.0.asc | sudo tee /etc/apt/trusted.gpg.d/server-7.0.asc
          echo "deb [ arch=amd64,arm64 ] https://repo.mongodb.org/apt/ubuntu jammy/mongodb-org/7.0 multiverse" | sudo tee /etc/apt/sources.list.d/mongodb-org-7.0.list
          sudo apt-get update
          sudo apt-get install -y mongodb-database-tools

      - name: Create backup directory
        run: mkdir -p backups

      - name: Dump MongoDB database
        run: |
          echo "Starting MongoDB backup..."

          # Sử dụng MONGO_IP thay cho MONGO_URL để giảm số lượng biến cần cấu hình
          mongodump \
            --uri="mongodb://admin:rootpassword@${{ secrets.MONGO_IP }}:27017/dbFashion" \
            --gzip \
            --archive="backups/mongodb.archive.gz"

          echo "MongoDB backup completed."

      - name: Show backup size
        run: ls -lh backups/

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'ap-southeast-1' }}

      - name: Upload backup to S3
        run: |
          TIMESTAMP=$(date +"%Y-%m-%d_%H-%M-%S")

          aws s3 cp \
            backups/mongodb.archive.gz \
            s3://${{ secrets.S3_BACKUP_BUCKET }}/mongodb/${TIMESTAMP}/mongodb.archive.gz \
            --endpoint-url=${{ secrets.S3_ENDPOINT }}

          echo "MongoDB backup uploaded to S3."

      - name: Cleanup old backups (older than ${{ env.BACKUP_RETENTION_DAYS }} days)
        run: |
          CUTOFF_DATE=$(date -d "-${{ env.BACKUP_RETENTION_DAYS }} days" +"%Y-%m-%d")

          aws s3 ls s3://${{ secrets.S3_BACKUP_BUCKET }}/mongodb/ --endpoint-url=${{ secrets.S3_ENDPOINT }} | while read -r line; do
            FOLDER_DATE=$(echo "$line" | awk '{print $2}' | cut -d'/' -f1 | cut -d'_' -f1)
            if [[ "$FOLDER_DATE" < "$CUTOFF_DATE" ]]; then
              FOLDER_NAME=$(echo "$line" | awk '{print $2}')
              echo "Deleting old backup: $FOLDER_NAME"
              aws s3 rm "s3://${{ secrets.S3_BACKUP_BUCKET }}/mongodb/${FOLDER_NAME}" --recursive --endpoint-url=${{ secrets.S3_ENDPOINT }}
            fi
          done

      - name: Upload backup as GitHub Artifact (fallback)
        uses: actions/upload-artifact@v4
        with:
          name: mongodb-backup-${{ github.run_number }}
          path: backups/mongodb.archive.gz
          retention-days: 7

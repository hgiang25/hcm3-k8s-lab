name: Deploy to Kubernetes - App Cluster

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Docker image tag to deploy (e.g. latest, sha-abc123)'
        required: false
        default: 'latest'
      deploy_target:
        description: 'What to deploy?'
        required: true
        type: choice
        options:
          - all
          - api-gateway
          - orders-service
          - order-history-service
          - products-service
          - payments-service
          - digital-identity-service
          - profile-service
          - client
          - logging

env:
  K8S_NAMESPACE: ecommerce
  REGISTRY: ${{ secrets.REGISTRY_USERNAME }}

jobs:
  deploy:
    name: Deploy to K8s App Cluster
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify cluster connection
        run: |
          kubectl config use-context application-cluster-admin@application-cluster
          kubectl cluster-info
          kubectl get nodes

      - name: Create namespace (if not exists)
        run: kubectl apply -f k8s/namespace.yaml

      - name: Configure Database Internal DNS (Endpoints)
        run: |
          # Use sed to replace IP placeholders with GitHub Secrets
          sed -i "s|\${REDIS_IP}|${{ secrets.REDIS_IP }}|g" k8s/database-endpoints.yaml
          sed -i "s|\${POSTGRES_IP}|${{ secrets.POSTGRES_IP }}|g" k8s/database-endpoints.yaml
          
          # Replace passwords in secrets.yaml
          sed -i "s|\${POSTGRES_USER}|${{ secrets.POSTGRES_USER }}|g" k8s/secrets.yaml
          sed -i "s|\${POSTGRES_PASSWORD}|${{ secrets.POSTGRES_PASSWORD }}|g" k8s/secrets.yaml
          sed -i "s|\${REDIS_PASSWORD}|${{ secrets.REDIS_PASSWORD }}|g" k8s/secrets.yaml
          
          # Apply the Internal DNS configuration
          kubectl apply -f k8s/database-endpoints.yaml

      - name: Apply ConfigMap and Secrets
        run: |
          kubectl apply -f k8s/configmap.yaml
          # Secrets should be pre-created via CLI, but apply template if exists
          if [ -f k8s/secrets.yaml ]; then
            kubectl apply -f k8s/secrets.yaml
          fi


      - name: Replace image tags in manifests
        run: |
          TAG="${{ github.event.inputs.image_tag }}"
          REGISTRY="${{ env.REGISTRY }}"

          # Replace ${CONTAINER_REGISTRY} placeholder with actual registry
          find k8s/ -name '*.yaml' -exec sed -i \
            "s|\${CONTAINER_REGISTRY}|${REGISTRY}|g" {} \;

          # Replace :latest with the specified tag
          if [ "$TAG" != "latest" ]; then
            find k8s/ -name '*.yaml' -exec sed -i \
              "s|:latest|:${TAG}|g" {} \;
          fi



      - name: Deploy API Gateway
        if: ${{ github.event.inputs.deploy_target == 'all' || github.event.inputs.deploy_target == 'api-gateway' }}
        run: kubectl apply -f k8s/api-gateway/

      - name: Deploy Orders Service
        if: ${{ github.event.inputs.deploy_target == 'all' || github.event.inputs.deploy_target == 'orders-service' }}
        run: kubectl apply -f k8s/orders-service/

      - name: Deploy Order History Service
        if: ${{ github.event.inputs.deploy_target == 'all' || github.event.inputs.deploy_target == 'order-history-service' }}
        run: kubectl apply -f k8s/order-history-service/

      - name: Deploy Products Service
        if: ${{ github.event.inputs.deploy_target == 'all' || github.event.inputs.deploy_target == 'products-service' }}
        run: kubectl apply -f k8s/products-service/

      - name: Deploy Payments Service
        if: ${{ github.event.inputs.deploy_target == 'all' || github.event.inputs.deploy_target == 'payments-service' }}
        run: kubectl apply -f k8s/payments-service/

      - name: Deploy Digital Identity Service
        if: ${{ github.event.inputs.deploy_target == 'all' || github.event.inputs.deploy_target == 'digital-identity-service' }}
        run: kubectl apply -f k8s/digital-identity-service/

      - name: Deploy Profile Service
        if: ${{ github.event.inputs.deploy_target == 'all' || github.event.inputs.deploy_target == 'profile-service' }}
        run: kubectl apply -f k8s/profile-service/

      - name: Deploy Client
        if: ${{ github.event.inputs.deploy_target == 'all' || github.event.inputs.deploy_target == 'client' }}
        run: kubectl apply -f k8s/client/

      - name: Deploy Logging Stack
        if: ${{ github.event.inputs.deploy_target == 'all' || github.event.inputs.deploy_target == 'logging' }}
        run: kubectl apply -f k8s/logging/

      - name: Deploy Ingress and Public ELB
        if: ${{ github.event.inputs.deploy_target == 'all' }}
        run: |
          echo "Installing NGINX Ingress Controller..."
          kubectl apply -f https://raw.githubusercontent.com/kubernetes/ingress-nginx/controller-v1.9.5/deploy/static/provider/cloud/deploy.yaml
          
          echo "Waiting for NGINX Ingress Controller service to be created..."
          sleep 15

          echo "Patching NGINX Ingress Controller pod anti-affinity..."
          kubectl patch deployment ingress-nginx-controller -n ingress-nginx \
            --patch-file k8s/ingress-nginx-deployment-patch.yaml
          
          echo "Applying Ingress Rules..."
          kubectl apply -f k8s/ingress.yaml
          
          echo "Patching Nginx Ingress Controller to create CMC Public ELB..."
          kubectl patch svc ingress-nginx-controller -n ingress-nginx --patch-file k8s/ingress-nginx-svc-patch.yaml || echo "Nginx Ingress Controller not found or named differently, skipping ELB patch."

      - name: Wait for rollout
        if: ${{ github.event.inputs.deploy_target == 'all' }}
        run: |
          echo "Waiting for deployments to be ready..."
          kubectl -n ${{ env.K8S_NAMESPACE }} rollout status deployment/api-gateway --timeout=300s
          kubectl -n ${{ env.K8S_NAMESPACE }} rollout status deployment/orders-service --timeout=300s
          kubectl -n ${{ env.K8S_NAMESPACE }} rollout status deployment/products-service --timeout=300s
          kubectl -n ${{ env.K8S_NAMESPACE }} rollout status deployment/client --timeout=300s
          kubectl -n ${{ env.K8S_NAMESPACE }} rollout status deployment/loki --timeout=300s
          kubectl -n ${{ env.K8S_NAMESPACE }} rollout status deployment/grafana --timeout=300s
          echo "All deployments are ready!"

      - name: Show deployment status
        run: |
          echo "=== Pods ==="
          kubectl -n ${{ env.K8S_NAMESPACE }} get pods -o wide
          echo ""
          echo "=== Services ==="
          kubectl -n ${{ env.K8S_NAMESPACE }} get svc
          echo ""
          echo "=== Ingress ==="
          kubectl -n ${{ env.K8S_NAMESPACE }} get ingress

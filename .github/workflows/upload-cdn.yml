name: Sync CDN to S3

on:
  push:
    branches:
      - main
    paths:
      - 'cdn/fashion-dataset/**'
  workflow_dispatch:

jobs:
  upload-to-s3:
    name: Sync Static Assets to CMC Cloud S3
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure CMC S3 Credentials
        run: |
          echo "Configuring CMC S3 credentials..."

          echo "AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}" >> "$GITHUB_ENV"
          echo "AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}" >> "$GITHUB_ENV"
          echo "AWS_DEFAULT_REGION=ap-southeast-1" >> "$GITHUB_ENV"

      - name: Verify CMC S3 access
        run: |
          echo "Checking CMC S3 access..."

          aws s3api head-bucket \
            --bucket "${{ secrets.S3_CDN_BUCKET }}" \
            --endpoint-url="${{ secrets.S3_ENDPOINT }}"

      - name: Sync CDN folder to S3
        run: |
          echo "Starting S3 Sync for CDN assets..."

          aws s3 sync \
            cdn/fashion-dataset/ \
            "s3://${{ secrets.S3_CDN_BUCKET }}/" \
            --endpoint-url="${{ secrets.S3_ENDPOINT }}"

          echo "CDN sync completed successfully!"